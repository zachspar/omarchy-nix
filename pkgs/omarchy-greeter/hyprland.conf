# Minimal Hyprland config for the SDDM Wayland greeter.
# SDDM starts the greeter itself after the compositor is ready.
#
# Hyprland 0.53+ windowrule syntax (match: + explicit effect values).
# Boolean effects need an on/off value. A bare `float` is a parse error
# ("invalid field float: missing a value") on Hyprland 0.53+.
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}

animations {
  enabled = false
}

decoration {
  rounding = 0
  blur {
    enabled = false
  }
}

windowrule = float on, match:class ^(sddm-greeter)$
windowrule = pin on, match:class ^(sddm-greeter)$
windowrule = stay_focused on, match:class ^(sddm-greeter)$
windowrule = no_anim on, match:class ^(sddm-greeter)$
windowrule = border_size 0, match:class ^(sddm-greeter)$
windowrule = no_shadow on, match:class ^(sddm-greeter)$
